<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>mood eats — eat how you feel</title>
        <link rel="icon" href="/favicon.ico" />
        <meta
            name="description"
            content="Mood-based food recommendations. Eat how you feel."
        />
        <meta property="og:title" content="mood eats" />
        <meta
            property="og:description"
            content="Eat how you feel. Coming soon to iOS."
        />
        <meta property="og:type" content="website" />
        <style>
            :root {
                --bg: #faf7f2;
                --bg-elevated: #ffffff;
                --ink: #1a1614;
                --ink-soft: #4a4239;
                --ink-mute: #8e8580;
                --line: #e8e1d5;
                --line-soft: #f0ebe0;
                --card-bg: #ffffff;
                --tag-bg: #f0ebe0;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --bg: #1a1614;
                    --bg-elevated: #221d1a;
                    --ink: #faf7f2;
                    --ink-soft: #d4c9ba;
                    --ink-mute: #8e8580;
                    --line: #2e2722;
                    --line-soft: #261f1b;
                    --card-bg: #221d1a;
                    --tag-bg: #2e2722;
                }
            }

            * {
                box-sizing: border-box;
                margin: 0;
                padding: 0;
            }

            html,
            body {
                height: 100%;
            }

            body {
                background: var(--bg);
                color: var(--ink);
                font-family:
                    -apple-system, BlinkMacSystemFont, 'SF Pro Display',
                    'SF Pro Text', 'Segoe UI', system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
                overflow-x: hidden;
                position: relative;
            }

            /* Floating emojis background */
            .emoji-bg {
                position: fixed;
                inset: 0;
                pointer-events: none;
                overflow: hidden;
                z-index: 0;
            }

            .emoji {
                position: absolute;
                font-size: 42px;
                opacity: 0;
                animation:
                    floatIn 1.2s ease-out forwards,
                    drift 8s ease-in-out infinite;
            }

            @keyframes floatIn {
                from {
                    opacity: 0;
                    transform: translateY(20px) scale(0.8);
                }
                to {
                    opacity: 1;
                    transform: translateY(0) scale(1);
                }
            }

            @keyframes drift {
                0%,
                100% {
                    transform: translateY(0) rotate(0deg);
                }
                50% {
                    transform: translateY(-12px) rotate(3deg);
                }
            }

            .emoji:nth-child(1) {
                top: 8%;
                left: 8%;
                animation-delay: 0.1s, 1.3s;
            }
            .emoji:nth-child(2) {
                top: 14%;
                right: 10%;
                animation-delay: 0.3s, 1.5s;
            }
            .emoji:nth-child(3) {
                top: 28%;
                left: 12%;
                animation-delay: 0.5s, 1.7s;
            }
            .emoji:nth-child(4) {
                top: 36%;
                right: 8%;
                animation-delay: 0.7s, 1.9s;
            }
            .emoji:nth-child(5) {
                top: 50%;
                right: 14%;
                animation-delay: 0.9s, 2.1s;
            }
            .emoji:nth-child(6) {
                top: 62%;
                left: 10%;
                animation-delay: 1.1s, 2.3s;
            }
            .emoji:nth-child(7) {
                top: 72%;
                right: 12%;
                animation-delay: 1.3s, 2.5s;
            }
            .emoji:nth-child(8) {
                top: 80%;
                left: 14%;
                animation-delay: 1.5s, 2.7s;
            }

            @media (max-width: 600px) {
                .emoji {
                    font-size: 32px;
                }
                .emoji:nth-child(3),
                .emoji:nth-child(5),
                .emoji:nth-child(7) {
                    display: none;
                }
            }

            /* Top nav */
            .nav {
                position: relative;
                z-index: 10;
                max-width: 1080px;
                margin: 0 auto;
                padding: 32px 32px 0;
                display: flex;
                justify-content: space-between;
                align-items: center;
            }

            .logo {
                font-size: 20px;
                font-weight: 800;
                letter-spacing: -0.02em;
                color: var(--ink);
                text-decoration: none;
                display: inline-flex;
                align-items: baseline;
                gap: 4px;
            }

            .logo em {
                font-style: italic;
                font-weight: 700;
                color: var(--ink-mute);
            }

            .nav-links {
                display: flex;
                gap: 24px;
                font-size: 14px;
                font-weight: 500;
            }

            .nav-links a {
                color: var(--ink-mute);
                text-decoration: none;
                transition: color 0.15s ease;
            }

            .nav-links a:hover {
                color: var(--ink);
            }

            /* Main hero */
            .hero {
                position: relative;
                z-index: 5;
                min-height: calc(100vh - 80px);
                display: flex;
                flex-direction: column;
                justify-content: center;
                align-items: center;
                text-align: center;
                padding: 80px 24px 60px;
                max-width: 720px;
                margin: 0 auto;
            }

            .hero-inner {
                opacity: 0;
                animation: fadeUp 1s ease-out 0.5s forwards;
            }

            @keyframes fadeUp {
                from {
                    opacity: 0;
                    transform: translateY(16px);
                }
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }

            h1 {
                font-size: clamp(56px, 12vw, 112px);
                font-weight: 800;
                line-height: 1;
                letter-spacing: -0.04em;
                margin-bottom: 24px;
                color: var(--ink);
            }

            h1 em {
                font-style: italic;
                font-weight: 700;
                color: var(--ink-mute);
            }

            .tagline {
                font-size: clamp(14px, 2vw, 16px);
                font-weight: 600;
                letter-spacing: 0.32em;
                text-transform: uppercase;
                color: var(--ink-mute);
                margin-bottom: 56px;
            }

            .description {
                font-size: clamp(18px, 3vw, 22px);
                line-height: 1.5;
                color: var(--ink-soft);
                max-width: 520px;
                margin: 0 auto 48px;
                font-weight: 400;
            }

            .description em {
                font-style: italic;
                font-weight: 500;
                color: var(--ink);
            }

            /* CTA card */
            .cta-card {
                background: var(--card-bg);
                border: 1px solid var(--line);
                border-radius: 20px;
                padding: 24px 28px;
                display: inline-flex;
                flex-direction: column;
                align-items: center;
                gap: 8px;
                max-width: 100%;
            }

            .cta-status {
                display: inline-flex;
                align-items: center;
                gap: 8px;
                font-size: 13px;
                font-weight: 500;
                color: var(--ink-mute);
            }

            .pulse {
                width: 8px;
                height: 8px;
                background: var(--ink);
                border-radius: 50%;
                animation: pulse 2s ease-in-out infinite;
            }

            @keyframes pulse {
                0%,
                100% {
                    opacity: 0.4;
                    transform: scale(1);
                }
                50% {
                    opacity: 1;
                    transform: scale(1.2);
                }
            }

            .cta-text {
                font-size: 18px;
                font-weight: 700;
                color: var(--ink);
                letter-spacing: -0.01em;
            }

            .cta-meta {
                font-size: 13px;
                color: var(--ink-mute);
                margin-top: 4px;
            }

            /* Footer */
            footer {
                position: relative;
                z-index: 10;
                max-width: 1080px;
                margin: 0 auto;
                padding: 32px;
                display: flex;
                justify-content: space-between;
                align-items: center;
                flex-wrap: wrap;
                gap: 16px;
                font-size: 13px;
                color: var(--ink-mute);
                border-top: 1px solid var(--line);
            }

            footer a {
                color: var(--ink-mute);
                text-decoration: none;
            }

            footer a:hover {
                color: var(--ink);
            }

            .footer-links {
                display: flex;
                gap: 20px;
            }

            ::selection {
                background: var(--ink);
                color: var(--bg);
            }

            @media (max-width: 600px) {
                .nav {
                    padding: 20px 20px 0;
                }
                .hero {
                    padding: 60px 20px 40px;
                    min-height: calc(100vh - 60px);
                }
                footer {
                    padding: 24px 20px;
                    flex-direction: column;
                    align-items: flex-start;
                }
            }

            @media (prefers-reduced-motion: reduce) {
                .emoji {
                    animation: none;
                    opacity: 1;
                }
                .hero-inner {
                    animation: none;
                    opacity: 1;
                }
                .pulse {
                    animation: none;
                }
            }
        </style>
    </head>
    <body>
        <div class="emoji-bg" aria-hidden="true">
            <span class="emoji">😊</span>
            <span class="emoji">🥱</span>
            <span class="emoji">🤩</span>
            <span class="emoji">😤</span>
            <span class="emoji">😢</span>
            <span class="emoji">😌</span>
            <span class="emoji">🤢</span>
            <span class="emoji">😑</span>
        </div>

        <nav class="nav">
            <a href="/" class="logo">mood <em>eats</em></a>
            <div class="nav-links">
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
            </div>
        </nav>

        <main class="hero">
            <div class="hero-inner">
                <h1>mood <em>eats</em></h1>
                <div class="tagline">Eat how you feel</div>
                <p class="description">
                    That mood you can't quite put into words.
                    <em>mood eats</em> finds the meal that matches it.
                </p>

                <div class="cta-card">
                    <div class="cta-status">
                        <span class="pulse"></span>
                        <span>Coming soon</span>
                    </div>
                    <div class="cta-text">iOS App Store</div>
                    <div class="cta-meta">Launching 2026</div>
                </div>
            </div>
        </main>

        <footer>
            <div>© 2026 mood eats · Made in Port Moody, BC</div>
            <div class="footer-links">
                <a href="/privacy">Privacy</a>
                <a href="/terms">Terms</a>
                <a href="mailto:support@moodeats.io">Contact</a>
            </div>
        </footer>
    </body>
</html>
